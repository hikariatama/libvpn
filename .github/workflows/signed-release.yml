name: Signed release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag on main (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: ref
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$release_sha" origin/main
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

  sign:
    needs: resolve
    name: Sign ${{ needs.resolve.outputs.sha }} on ${{ matrix.runner }}
    # This environment MUST restrict deployments to main, require owner review,
    # and own the secret below. Repository/org signing secrets must be removed.
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      FENNEC_BUILD_PYTHON: python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Check immutable release metadata and test
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          ./test.sh
      - name: Build signed distribution
        env:
          RELEASE_KEY: ${{ secrets.FENNEC_PROTECTED_UPDATE_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/fennec-release.key"
          trap 'rm -f "$key_file"' EXIT
          export FENNEC_SIGNING_KEY_FILE="$key_file"
          python3 -I -S -B - <<'PY'
          import base64, os
          key = base64.b64decode(os.environ.pop('RELEASE_KEY'), validate=True)
          if len(key) != 32:
              raise SystemExit('Missing or invalid protected signing key')
          fd = os.open(os.environ['FENNEC_SIGNING_KEY_FILE'], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'wb') as output:
              output.write(key)
          PY
          unset RELEASE_KEY
          ./build.sh
          ./test.sh
      - name: Verify distribution
        id: metadata
        run: |
          set -euo pipefail
          python3 Tools/distribution.py metadata --github-output "$GITHUB_OUTPUT"
          stem=$(python3 Tools/distribution.py metadata | python3 -c 'import json,sys; print(json.load(sys.stdin)["stem"])')
          work/dmg-venv/bin/python3 Tools/distribution.py verify "outputs/$stem.json" --require-dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-${{ steps.metadata.outputs.stem }}
          path: |
            outputs/${{ steps.metadata.outputs.stem }}.dmg
            outputs/${{ steps.metadata.outputs.stem }}.zip
            outputs/${{ steps.metadata.outputs.stem }}.sha256
            outputs/${{ steps.metadata.outputs.stem }}.json
          if-no-files-found: error
          compression-level: 0

  draft:
    needs: [resolve, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: draft-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Publication guards come from the reviewed workflow commit, even if
          # an older release tag contains an earlier publisher implementation.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: signed-*
          path: artifacts
          merge-multiple: true
      - name: Prepare unpublished draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: refs/tags/${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: RELEASE_VERSION="${RELEASE_TAG#v}" python3 scripts/publish-draft.py artifacts
